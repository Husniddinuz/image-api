openapi: 3.1.0

info:
  title: Image API
  version: 1.0.0
  description: |
    Хранилище картинок. Кроме регистрации и входа, везде нужен bearer-токен
    Sanctum. Пользователь видит только свои картинки.
  license:
    name: MIT

servers:
  - url: http://localhost:8000/api
    description: Локальный сервер

tags:
  - name: Аутентификация
    description: Регистрация, вход, токены.
  - name: Изображения
    description: Загрузка, просмотр, удаление картинок.

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Аутентификация]
      summary: Регистрация
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string, maxLength: 255, example: Ada }
                email: { type: string, format: email, example: ada@example.com }
                password: { type: string, format: password, minLength: 8 }
                password_confirmation: { type: string, format: password }
                device_name: { type: string, example: iphone }
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPayload' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [Аутентификация]
      summary: Вход
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string }
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPayload' }
        '422':
          description: |
            Неверные данные. Ответ одинаковый, есть такой аккаунт или нет.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      tags: [Аутентификация]
      summary: Выход, отзывает текущий токен
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Token revoked. }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/me:
    get:
      tags: [Аутентификация]
      summary: Текущий пользователь
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /images:
    get:
      tags: [Изображения]
      summary: Список картинок, сначала новые
      parameters:
        - name: per_page
          in: query
          description: Сколько картинок на странице.
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          description: Курсор из `meta.next_cursor`.
          schema: { type: string }
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageCollection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

    post:
      tags: [Изображения]
      summary: Загрузить картинку
      description: |
        Повторная загрузка тех же байтов возвращает `200` и уже существующую
        картинку, дубликат не создаётся.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: PNG или JPEG, до 5 МБ.
                name:
                  type: string
                  maxLength: 255
                  description: Название. По умолчанию берётся имя файла.
      responses:
        '201':
          description: Сохранено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImagePayload' }
        '200':
          description: Такая картинка уже была загружена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImagePayload' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '413':
          description: Тело запроса намного больше лимита
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /images/{image}:
    parameters:
      - name: image
        in: path
        required: true
        description: id картинки.
        schema: { type: string, example: 01K3P8S0RZK7XW2Q9M4V6C1T5B }

    get:
      tags: [Изображения]
      summary: Метаданные
      responses:
        '200':
          description: Успешно
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImagePayload' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      tags: [Изображения]
      summary: Удалить
      description: |
        Файл с диска удаляется, когда его удалит последний владелец.
      responses:
        '204': { description: Удалено }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /images/{image}/content:
    parameters:
      - name: image
        in: path
        required: true
        description: id картинки.
        schema: { type: string }
      - name: download
        in: query
        description: Отдать файл вложением, а не встроенно.
        schema: { type: boolean, default: false }

    get:
      tags: [Изображения]
      summary: Скачать файл
      description: |
        Отдаётся потоком, с `ETag` и `Cache-Control: private, immutable`,
        так что повторный запрос получает `304`. На S3 с включённым
        `IMAGES_USE_TEMPORARY_URLS` вместо файла придёт `302` на подписанную
        ссылку.
      responses:
        '200':
          description: Успешно
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string, example: 'private, max-age=31536000, immutable' }
            X-Content-Type-Options:
              schema: { type: string, example: nosniff }
          content:
            image/webp:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '302':
          description: Редирект на подписанную ссылку
        '304':
          description: Не изменялось
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Токен Sanctum, например `3|Xh8k…`.

  schemas:
    User:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Ada }
        email: { type: string, format: email }

    TokenPayload:
      type: object
      properties:
        data:
          type: object
          properties:
            user: { $ref: '#/components/schemas/User' }
            token: { type: string, example: '3|Xh8kq2…' }
            token_type: { type: string, example: Bearer }

    Image:
      type: object
      properties:
        id: { type: string, example: 01K3P8S0RZK7XW2Q9M4V6C1T5B }
        name: { type: string, example: sunset.jpg }
        content_url: { type: string, format: uri }
        status:
          type: string
          enum: [pending, ready, failed]
          description: |
            `pending`, пока воркер не сожмёт картинку. Скачать можно в любом
            состоянии, меняются только `format` и `bytes`.
        format: { type: string, example: webp }
        mime_type: { type: string, example: image/webp }
        width: { type: integer, example: 3840 }
        height: { type: integer, example: 2160 }
        bytes: { type: integer, example: 527463 }
        original:
          type: object
          properties:
            format: { type: string, example: jpg }
            mime_type: { type: string, example: image/jpeg }
            bytes: { type: integer, example: 5617664 }
        compression:
          type: object
          properties:
            saved_bytes: { type: integer, example: 5090201 }
            saved_ratio: { type: number, format: float, example: 0.9061 }
        checksum:
          type: string
          description: sha-256 исходного файла, он же ключ дедупликации.
          example: sha256:9f86d081884c7d65…
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ImagePayload:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Image' }
        meta:
          type: object
          properties:
            deduplicated:
              type: boolean
              description: Такие байты уже лежали на диске, запись не делалась.
            already_owned:
              type: boolean
              description: Эта картинка уже была у вас загружена.

    ImageCollection:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Image' }
        links:
          type: object
          properties:
            first: { type: [string, 'null'] }
            last: { type: [string, 'null'] }
            prev: { type: [string, 'null'] }
            next: { type: [string, 'null'] }
        meta:
          type: object
          properties:
            path: { type: string }
            per_page: { type: integer }
            next_cursor: { type: [string, 'null'] }
            prev_cursor: { type: [string, 'null'] }

    Message:
      type: object
      properties:
        message: { type: string }

    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

  responses:
    Unauthenticated:
      description: Нет токена или он недействителен
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
          example: { message: Unauthenticated. }

    NotFound:
      description: |
        Картинки с таким id у этого аккаунта нет. На чужую картинку ответ
        такой же.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
          example: { message: Resource not found. }

    ValidationError:
      description: Ошибка валидации
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
          example:
            message: Only PNG and JPEG images are accepted.
            errors:
              image: [Only PNG and JPEG images are accepted.]

    TooManyRequests:
      description: Превышен лимит запросов
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
