openapi: 3.1.0

info:
  title: Image API
  version: 1.0.0
  description: |
    A private image library. Every route below except register and login
    requires a Sanctum bearer token, and every image is visible only to the
    account that uploaded it.
  license:
    name: MIT

servers:
  - url: http://localhost:8000/api
    description: Local

tags:
  - name: Auth
  - name: Images

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account and issue a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string, maxLength: 255, example: Ada }
                email: { type: string, format: email, example: ada@example.com }
                password: { type: string, format: password, minLength: 8 }
                password_confirmation: { type: string, format: password }
                device_name: { type: string, example: iphone }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPayload' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Exchange credentials for a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPayload' }
        '422':
          description: |
            Invalid credentials. Deliberately identical whether or not the
            account exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the token used for this call
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Token revoked. }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/me:
    get:
      tags: [Auth]
      summary: The authenticated user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /images:
    get:
      tags: [Images]
      summary: List your images, newest first
      parameters:
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          description: Opaque cursor from `meta.next_cursor`.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageCollection' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

    post:
      tags: [Images]
      summary: Upload a PNG or JPEG
      description: |
        Idempotent per (user, content): re-uploading bytes you already own
        returns `200` with the existing image instead of creating a duplicate.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: PNG or JPEG, 5 MB maximum.
                name:
                  type: string
                  maxLength: 255
                  description: Display name; defaults to the client filename.
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImagePayload' }
        '200':
          description: You already owned these exact bytes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImagePayload' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '413':
          description: Body far beyond the size limit; refused before parsing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /images/{image}:
    parameters:
      - name: image
        in: path
        required: true
        schema: { type: string, example: 01K3P8S0RZK7XW2Q9M4V6C1T5B }

    get:
      tags: [Images]
      summary: Image metadata
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImagePayload' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

    delete:
      tags: [Images]
      summary: Delete your copy
      description: |
        The stored bytes are erased once the last owner has deleted them.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /images/{image}/content:
    parameters:
      - name: image
        in: path
        required: true
        schema: { type: string }
      - name: download
        in: query
        description: Serve as an attachment rather than inline.
        schema: { type: boolean, default: false }

    get:
      tags: [Images]
      summary: The image bytes
      description: |
        Streamed with a strong `ETag` (the content digest) and
        `Cache-Control: private, immutable`, so a repeat fetch costs a `304`.
        When the disk is S3 and `IMAGES_USE_TEMPORARY_URLS` is on, answers
        `302` with a short-lived signed URL instead.
      responses:
        '200':
          description: OK
          headers:
            ETag:
              schema: { type: string }
            Cache-Control:
              schema: { type: string, example: 'private, max-age=31536000, immutable' }
            X-Content-Type-Options:
              schema: { type: string, example: nosniff }
          content:
            image/webp:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '302':
          description: Redirect to a signed storage URL
        '304':
          description: Not modified
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A Sanctum personal access token, e.g. `3|Xh8k…`.

  schemas:
    User:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Ada }
        email: { type: string, format: email }

    TokenPayload:
      type: object
      properties:
        data:
          type: object
          properties:
            user: { $ref: '#/components/schemas/User' }
            token: { type: string, example: '3|Xh8kq2…' }
            token_type: { type: string, example: Bearer }

    Image:
      type: object
      properties:
        id: { type: string, example: 01K3P8S0RZK7XW2Q9M4V6C1T5B }
        name: { type: string, example: sunset.jpg }
        content_url: { type: string, format: uri }
        status:
          type: string
          enum: [pending, ready, failed]
          description: |
            `pending` until a worker compresses it. The image is downloadable
            in every state; only `format` and `bytes` change.
        format: { type: string, example: webp }
        mime_type: { type: string, example: image/webp }
        width: { type: integer, example: 3840 }
        height: { type: integer, example: 2160 }
        bytes: { type: integer, example: 527463 }
        original:
          type: object
          properties:
            format: { type: string, example: jpg }
            mime_type: { type: string, example: image/jpeg }
            bytes: { type: integer, example: 5617664 }
        compression:
          type: object
          properties:
            saved_bytes: { type: integer, example: 5090201 }
            saved_ratio: { type: number, format: float, example: 0.9061 }
        checksum:
          type: string
          description: sha-256 of the original upload; also the deduplication key.
          example: sha256:9f86d081884c7d65…
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ImagePayload:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Image' }
        meta:
          type: object
          properties:
            deduplicated:
              type: boolean
              description: These bytes were already stored, so nothing was written.
            already_owned:
              type: boolean
              description: You had uploaded this exact image before.

    ImageCollection:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Image' }
        links:
          type: object
          properties:
            first: { type: [string, 'null'] }
            last: { type: [string, 'null'] }
            prev: { type: [string, 'null'] }
            next: { type: [string, 'null'] }
        meta:
          type: object
          properties:
            path: { type: string }
            per_page: { type: integer }
            next_cursor: { type: [string, 'null'] }
            prev_cursor: { type: [string, 'null'] }

    Message:
      type: object
      properties:
        message: { type: string }

    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

  responses:
    Unauthenticated:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
          example: { message: Unauthenticated. }

    NotFound:
      description: |
        No such image for this account. Another user's image is deliberately
        indistinguishable from one that does not exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
          example: { message: Resource not found. }

    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
          example:
            message: Only PNG and JPEG images are accepted.
            errors:
              image: [Only PNG and JPEG images are accepted.]

    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Message' }
