; Decoding a large JPEG costs roughly width * height * 4 bytes of RAM, so the
; workers need considerably more headroom than a typical web request.
memory_limit = 512M

; Must stay above IMAGES_MAX_UPLOAD_KB (5 MB) plus multipart framing, or PHP
; discards the body before the application can report a useful error.
upload_max_filesize = 6M
post_max_size = 8M
max_file_uploads = 20

max_execution_time = 60

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

expose_php = Off

; A startup warning (an oversized POST, say) is emitted before the framework
; boots, so with display_errors on it lands in front of the JSON body and every
; client fails to parse the response. Log it instead.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
